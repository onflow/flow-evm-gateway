name: "Build & Push EVM Gateway Image to Public Repo"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build. Also used as the docker image tag.'
        required: true
        type: string

env:
  DOCKER_IMAGE_URL: public.ecr.aws/onflow/flow-evm-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.tag }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLIC_PUSH_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push
        run: |-
          docker build \
            --build-arg VERSION="${{ inputs.tag }}" \
            --build-arg ARCH=amd64 \
            -t ${{ env.DOCKER_IMAGE_URL }}:${{ inputs.tag }} \
            --file Dockerfile .
          docker push ${{ env.DOCKER_IMAGE_URL }}:${{ inputs.tag }}
